name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The package version must match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p 'require("./package.json").version')"
          if [ "$have" != "$want" ]; then echo "::error::package.json is $have, tag is $GITHUB_REF_NAME"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --notes "Install with: code --install-extension mdsig-${GITHUB_REF_NAME#v}.vsix"
        env:
          GH_TOKEN: ${{ github.token }}
